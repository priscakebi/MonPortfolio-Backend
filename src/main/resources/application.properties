spring.application.name=backend

# Render fournit le port via la variable PORT
server.port=${PORT:8080}

# Envoi d'email via l'API Brevo (secrets fournis par variables d'environnement, jamais dans Git)
app.mail.api-key=${BREVO_API_KEY}
app.mail.sender=${MAIL_SENDER:priscakebi00@gmail.com}
app.mail.recipient=${MAIL_RECIPIENT:priscakebi00@gmail.com}

# URL(s) du frontend autorisée(s) à appeler l'API, séparées par des virgules
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
